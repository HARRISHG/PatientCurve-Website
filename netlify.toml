# Vite + React site, prerendered to static HTML at build time.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# The site is now a single page. Old pages point to the matching section.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/how-it-works"
  to = "/#how-it-works"
  status = 301

[[redirects]]
  from = "/how-it-works.html"
  to = "/#how-it-works"
  status = 301

[[redirects]]
  from = "/revenue-audit"
  to = "/#demo"
  status = 301

[[redirects]]
  from = "/revenue-audit.html"
  to = "/#demo"
  status = 301

[[redirects]]
  from = "/thanks.html"
  to = "/thanks"
  status = 301

# Friendly shortcuts
[[redirects]]
  from = "/demo"
  to = "/#demo"
  status = 301

[[redirects]]
  from = "/audit"
  to = "/#demo"
  status = 301

[[redirects]]
  from = "/book"
  to = "/#demo"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'"

# Built JS/CSS have content hashes in their names, so they can be cached for good.
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Images and icons aren't fingerprinted: cache briefly and revalidate in the background.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"
